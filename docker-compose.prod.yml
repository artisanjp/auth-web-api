services:
  core:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:?Set AUTHENTIK_TAG in the env file - upgrade sequentially, see README}
    container_name: artisan-auth-core
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_POSTGRESQL__HOST: ${POSTGRES_HOST:-postgres}
      AUTHENTIK_POSTGRESQL__NAME: ${POSTGRES_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      # Email configuration
      AUTHENTIK_EMAIL__HOST: ${SMTP_HOST:-postfix}
      AUTHENTIK_EMAIL__PORT: ${SMTP_PORT:-25}
      AUTHENTIK_EMAIL__USERNAME: ${SMTP_USERNAME:-}
      AUTHENTIK_EMAIL__PASSWORD: ${SMTP_PASSWORD:-}
      AUTHENTIK_EMAIL__USE_TLS: ${SMTP_USE_TLS:-false}
      AUTHENTIK_EMAIL__USE_SSL: ${SMTP_USE_SSL:-false}
      AUTHENTIK_EMAIL__FROM: ${SMTP_FROM:-noreply@auth.artisan-tools.com}
    volumes:
      - ./data:/data
      - artisan-auth-templates:/templates
    networks:
      - artisan-hq-network-01
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth-web-api.rule=Host(`auth.artisan-tools.com`)"
      - "traefik.http.routers.auth-web-api.entrypoints=websecure"
      - "traefik.http.routers.auth-web-api.tls=true"
      - "traefik.http.services.auth-web-api.loadbalancer.server.port=9000"
      - "traefik.http.services.auth-web-api.loadbalancer.server.scheme=http"
      - "traefik.http.middlewares.auth-web-api-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.auth-web-api.middlewares=auth-web-api-headers"
      - "traefik.docker.network=artisan-hq-network-01"

  worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:?Set AUTHENTIK_TAG in the env file - upgrade sequentially, see README}
    container_name: artisan-auth-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_POSTGRESQL__HOST: ${POSTGRES_HOST:-postgres}
      AUTHENTIK_POSTGRESQL__NAME: ${POSTGRES_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      # Email configuration
      AUTHENTIK_EMAIL__HOST: ${SMTP_HOST:-postfix}
      AUTHENTIK_EMAIL__PORT: ${SMTP_PORT:-25}
      AUTHENTIK_EMAIL__USERNAME: ${SMTP_USERNAME:-}
      AUTHENTIK_EMAIL__PASSWORD: ${SMTP_PASSWORD:-}
      AUTHENTIK_EMAIL__USE_TLS: ${SMTP_USE_TLS:-false}
      AUTHENTIK_EMAIL__USE_SSL: ${SMTP_USE_SSL:-false}
      AUTHENTIK_EMAIL__FROM: ${SMTP_FROM:-noreply@auth.artisan-tools.com}
    volumes:
      - ./data:/data
      - artisan-auth-templates:/templates
    networks:
      - artisan-hq-network-01
    labels:
      - "traefik.enable=false"

  ldap:
    # LDAP outpost — shares AUTHENTIK_TAG with core/worker so the outpost
    # can never skew from the server version (mismatches are unsupported).
    image: ghcr.io/goauthentik/ldap:${AUTHENTIK_TAG:?Set AUTHENTIK_TAG in the env file - upgrade sequentially, see README}
    container_name: artisan-auth-ldap
    restart: unless-stopped
    depends_on:
      - core
    environment:
      # Outpost -> core stays inside the docker network (plain HTTP on 9000),
      # hence AUTHENTIK_INSECURE.
      AUTHENTIK_HOST: http://artisan-auth-core:9000
      AUTHENTIK_INSECURE: "true"
      # Empty default (not :?) so a missing token never blocks compose
      # operations on core/worker; an empty token surfaces as 403s in the
      # ldap container logs instead.
      AUTHENTIK_TOKEN: ${AUTHENTIK_LDAP_TOKEN:-}
    ports:
      # The outpost listens on 3389/6636 internally (non-root).
      - "389:3389" # LDAP
      - "636:6636" # LDAPS
    networks:
      - artisan-hq-network-01
    labels:
      - "traefik.enable=false"

networks:
  artisan-hq-network-01:
    external: true

volumes:
  artisan-auth-templates:
    driver: local
